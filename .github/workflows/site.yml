name: Build analysis and site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: transfermarkt-${{ github.run_id }}
          restore-keys: transfermarkt-
      - name: Run pipeline on real data
        run: python -m pricebias.export --raw data/raw --out web/public/data --download
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-data
          path: web/public/data
