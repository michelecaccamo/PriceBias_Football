name: Build analysis and site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: transfermarkt-${{ github.run_id }}
          restore-keys: transfermarkt-
      - name: Run pipeline on real data
        run: python -m pricebias.export --raw data/raw --out web/public/data --download
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-data
          path: web/public/data

  site:
    needs: analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: analysis-data
          path: web/public/data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Publishes https://<owner>.github.io/PriceBias_Football/ from the default branch.
  # Requires Settings → Pages → Source: "GitHub Actions" (one-time, done by the repo owner).
  deploy:
    needs: site
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
